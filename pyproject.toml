[project]
name = "student-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2.8,<6.0",
    "whitenoise>=6.9,<7.0",
    "dj-database-url>=2.3,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyMySQL>=1.1.1",
    "requests>=2.31",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pypdf>=5.0",
    "pytesseract>=0.3.10",
]

[tool.vercel.scripts]
build = "python build.py"
